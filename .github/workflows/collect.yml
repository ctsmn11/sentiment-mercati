name: Daily data collection

on:
  schedule:
    # Ogni giorno alle 18:00 UTC (= 20:00 ora italiana in estate)
    - cron: '0 18 * * *'
  workflow_dispatch:  # permette esecuzione manuale dal tab Actions

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Collect news + sentiment (Alpha Vantage)
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python pipeline/classify_news.py

      - name: Fetch prices (yfinance)
        run: python pipeline/fetch_prices.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pipeline/data/news.json pipeline/data/*/prices.json pipeline/tickers.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%Y-%m-%d)"
          git push
