name: Daily data collection

on:
  schedule:
    # Ogni giorno alle 18:00 UTC (= 20:00 ora italiana in estate)
    - cron: '0 18 * * *'
  workflow_dispatch:  # permette esecuzione manuale dal tab Actions

# Evita che un run schedulato e uno manuale si sovrappongano competendo sul bucket GCS.
concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # solo checkout, nessun push di dati

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # News e prezzi sono indipendenti: un fallimento dei prezzi
      # non deve far perdere le news già raccolte (budget Alpha Vantage 25/giorno).
      - name: Collect news + sentiment (Alpha Vantage)
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          GCS_BUCKET: sentiment-mercati-data
        run: python pipeline/classify_news.py

      - name: Fetch prices (yfinance)
        if: always()  # i prezzi vanno scaricati anche se la raccolta news è fallita
        env:
          GCS_BUCKET: sentiment-mercati-data
        run: python pipeline/fetch_prices.py
