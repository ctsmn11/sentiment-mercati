name: Daily data collection

on:
  schedule:
    # Ogni giorno alle 18:00 UTC (= 20:00 ora italiana in estate)
    - cron: '0 18 * * *'
  workflow_dispatch:  # permette esecuzione manuale dal tab Actions

# Evita che un run schedulato e uno manuale si sovrappongano competendo sul push.
concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Necessario per il git push: senza, il GITHUB_TOKEN è read-only sui repo
    # con i default recenti e il push fallirebbe con 403.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # News e prezzi sono committati separatamente: un fallimento dei prezzi
      # non deve far perdere le news già raccolte (budget Alpha Vantage 25/giorno).
      - name: Collect news + sentiment (Alpha Vantage)
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python pipeline/classify_news.py

      - name: Commit news
        if: always()  # committa anche il progresso parziale se la raccolta crasha
        run: |
          git add -f pipeline/data/news.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica alle news."
          else
            git commit -m "data: news update $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Fetch prices (yfinance)
        if: always()  # i prezzi vanno scaricati anche se la raccolta news è fallita
        run: python pipeline/fetch_prices.py

      - name: Commit prices
        if: always()
        run: |
          git add -f pipeline/data/*/prices.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai prezzi."
          else
            git commit -m "data: prices update $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi
