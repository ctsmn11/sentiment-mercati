name: Analyze analytical dataset

on:
  workflow_dispatch:
    inputs:
      dataset_version:
        description: Immutable dataset version to analyze
        required: true
        type: string
      primary_ticker:
        description: Primary ticker for the research conclusion
        required: true
        default: ^GSPC
        type: string
      max_lag:
        description: Maximum trading-session lag
        required: true
        default: '5'
        type: choice
        options:
          - '3'
          - '5'
          - '10'

concurrency:
  group: analytical-dataset-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline tests
        run: python -m unittest discover -s pipeline/tests -v

      - name: Analyze dataset snapshot
        shell: bash
        env:
          BQ_DATASET: sentiment_mercati
          BQ_LOCATION: EU
          INPUT_DATASET_VERSION: ${{ inputs.dataset_version }}
          INPUT_PRIMARY_TICKER: ${{ inputs.primary_ticker }}
          INPUT_MAX_LAG: ${{ inputs.max_lag }}
        run: |
          args=(
            --primary-ticker "$INPUT_PRIMARY_TICKER"
            --dataset-version "$INPUT_DATASET_VERSION"
            --max-lag "$INPUT_MAX_LAG"
            --git-commit "${{ github.sha }}"
            --output-dir artifacts/analysis
          )

          python pipeline/analyze_dataset.py "${args[@]}"

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-analysis-${{ github.run_id }}
          path: artifacts/analysis/
          if-no-files-found: warn
